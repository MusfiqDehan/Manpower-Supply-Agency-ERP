{% load static %}

<!-- Navbar & Hero Start -->
<div class="container-fluid nav-bar p-0 sticky top-0 z-50" style="background: var(--bg-primary); backdrop-filter: blur(10px);">
  <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0" style="background: var(--bg-primary); border-bottom: 1px solid var(--border-color);">
    <a href="{% url 'website_v2:home' %}" class="navbar-brand p-0 flex items-center gap-2 hover:scale-105 transition-transform">
      <h1 class="display-5 m-0 flex items-center gap-2" style="color: var(--accent-primary);">
        <img src="{% static 'website_v2/img/brand-logo.webp' %}" class="img-fluid" alt="MSAgency Logo" style="max-width: 48px;" />
        MSAgency
      </h1>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" style="color: var(--text-primary);">
      <span class="fa fa-bars"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      <div class="navbar-nav ms-auto py-0 gap-2">
        <a href="{% url 'website_v2:home' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          Home
        </a>
        <a href="{% url 'website_v2:about' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          About
        </a>
        <a href="{% url 'website_v2:services' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          Services
        </a>
        <a href="{% url 'website_v2:countries' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          Countries
        </a>
        <a href="{% url 'website_v2:career' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          Career
        </a>
        <a href="{% url 'website_v2:contact' %}" class="nav-item nav-link transition-all hover:bg-opacity-80 rounded-lg px-3 py-2" style="color: var(--text-primary);">
          Contact
        </a>
      </div>
      <a href="{% url 'administration_app:user_login' %}" 
         class="btn border-secondary rounded-pill py-2 px-4 px-lg-3 mb-3 mb-md-3 mb-lg-0 ms-3 transition-all hover:scale-105"
         style="background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%); color: white; border: none;">
        <i class="fas fa-sign-in-alt me-2"></i>
        Sign In
      </a>
    </div>
  </nav>
</div>
<!-- Navbar & Hero End -->
